# ============================================================
# netlify.toml — Netlify deployment configuration
# ============================================================

[build]
  # Base directory is the frontend folder
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ============================================================
# SPA Fallback — critical for React Router client-side routing.
# Without this, any direct URL (e.g. /student/dashboard) returns 404.
# ============================================================
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ============================================================
# Security Headers
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    X-XSS-Protection        = "1; mode=block"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "geolocation=(), microphone=(), camera=()"

# Cache built JS/CSS assets aggressively (content-hashed filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
