# ============================================================
# DEV PROFILE — application-dev.properties
# Local PostgreSQL development. Copy from application.properties defaults.
# ============================================================

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/digital_lab_manual
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# --- Server ---
server.port=8080

# --- JWT ---
jwt.secret=dlme_super_secret_key_for_jwt_token_generation_2024_very_long_key_minimum_256_bits
jwt.expiration=86400000

# --- File Upload ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- Demo Data ---
app.seed.demo-data=true

# --- Logging ---
logging.level.com.example.digitallab=DEBUG
logging.level.org.springframework.security=DEBUG
