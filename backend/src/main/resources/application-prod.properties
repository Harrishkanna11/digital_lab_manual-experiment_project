# ============================================================
# PRODUCTION PROFILE — application-prod.properties
# All values read from environment variables.
# Never put real credentials here.
# ============================================================

# --- Datasource (Supabase PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# --- JPA / Hibernate ---
# Use 'update' initially; switch to 'validate' after migrations are stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# --- SSL for Supabase (required for Supabase pooler connections) ---
spring.datasource.hikari.data-source-properties.sslmode=require

# --- Server ---
server.port=${PORT:8080}

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- CORS (Netlify frontend URL) ---
app.cors.allowed-origins=${FRONTEND_URL:https://localhost:5173}

# --- File Upload ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# --- Demo Data Seeding ---
# Set to false in production to prevent auto-seeding demo accounts
app.seed.demo-data=${SEED_DEMO_DATA:false}

# --- Production Logging ---
logging.level.com.example.digitallab=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.root=WARN

# --- Error Handling ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
