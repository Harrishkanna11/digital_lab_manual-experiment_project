# ============================================================
# BASE CONFIGURATION — application.properties
#
# Active profile selection (overridden by SPRING_PROFILES_ACTIVE env var):
#   h2   -> In-memory H2 (default for quick local dev, no PostgreSQL required)
#   dev  -> Local PostgreSQL (application-dev.properties)
#   prod -> Supabase PostgreSQL (application-prod.properties)
#
# To run production: set SPRING_PROFILES_ACTIVE=prod
# ============================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# --- Server Port ---
server.port=${PORT:8080}

# --- JWT Base Defaults (overridden per profile) ---
jwt.secret=${JWT_SECRET:dlme_super_secret_key_for_jwt_token_generation_2024_very_long_key_minimum_256_bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- File Upload Base ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# --- Demo Data ---
app.seed.demo-data=${SEED_DEMO_DATA:true}

# --- CORS Base (overridden per profile) ---
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# --- JPA Base ---
spring.jpa.open-in-view=false
