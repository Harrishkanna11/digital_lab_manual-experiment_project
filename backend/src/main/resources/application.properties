# Active profile (defaults to in-memory H2 so no local PostgreSQL setup is required)
spring.profiles.active=h2

# Spring DataSource Configuration (PostgreSQL default when profile is not h2)
spring.datasource.url=jdbc:postgresql://localhost:5432/digital_lab_manual
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Server Port
server.port=8080

# JWT Configuration
jwt.secret=dlme_super_secret_key_for_jwt_token_generation_2024_very_long_key_minimum_256_bits
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# File Storage
app.upload.dir=./uploads

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.example.digitallab=DEBUG
logging.level.org.springframework.security=DEBUG
